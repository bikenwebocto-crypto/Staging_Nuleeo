# Cloud Monitoring alert policy: page when the `api` function logs server-side
# errors above a sustained rate. Catches what previously only sat in Cloud
# Logging with nobody watching: unhandled 500s (express.fallback-handler — now
# that async rejections are forwarded there, see server/asyncErrors.ts), failed
# Stripe webhook handlers (stripe.webhook-handler-failed), and any other
# logError(...) on a request path.
#
# === Prerequisite metric — create once via Console or CLI ===
#
#   gcloud logging metrics create api_error_logs \
#     --description="ERROR-severity logs from the Olio api function" \
#     --log-filter='resource.type="cloud_function"
#       AND resource.labels.function_name="api"
#       AND severity>=ERROR'
#
# NOTE: 2nd-gen functions run on Cloud Run. If your project's logs surface under
# resource.type="cloud_run_revision" instead of "cloud_function", swap BOTH the
# metric filter and the condition filter below to:
#   'resource.type="cloud_run_revision" AND resource.labels.service_name="api"'
#
# === Prerequisite notification channel ===
#
#   gcloud alpha monitoring channels create ...   # email / Slack / PagerDuty
#   then paste its full resource name into notificationChannels below.

displayName: "Olio api — server error rate elevated"
combiner: OR
enabled: true
documentation:
  content: |
    The api function is logging ERROR-severity entries above the normal rate.

    Likely causes: a broken deploy, a downstream outage (Firestore/Stripe), or a
    bug throwing on a request path. Unhandled async rejections now surface as
    express.fallback-handler 500s, and failed Stripe webhook handlers log
    stripe.webhook-handler-failed.

    First actions:
      1. Cloud Logging: severity>=ERROR, resource.labels.function_name="api",
         last 30m — group by jsonPayload.event to find the dominant error.
      2. If it started right after a deploy, roll back per
         infra/README.md -> Rollback.
  mimeType: text/markdown
conditions:
  - displayName: "api ERROR logs > 5 in 5m"
    conditionThreshold:
      filter: 'metric.type="logging.googleapis.com/user/api_error_logs" resource.type="cloud_run_revision"'
      comparison: COMPARISON_GT
      thresholdValue: 5
      duration: 0s
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_SUM
alertStrategy:
  autoClose: 1800s # auto-close after 30m with no further errors
notificationChannels:
  - projects/olio-wallet/notificationChannels/6264040661698284334
