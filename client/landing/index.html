<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Olio Wallet — Your real estate wallet</title>
    <meta
      name="description"
      content="Manage your properties, collect rent, and grow your real estate portfolio with Olio Wallet — the all-in-one platform for landlords."
    />
    <link rel="canonical" href="https://oliowallet.com/" />
    <meta name="theme-color" content="#171717" />

    <!-- Favicon / icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Olio Wallet" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Olio Wallet" />
    <meta property="og:url" content="https://oliowallet.com/" />
    <meta property="og:title" content="Olio Wallet — Your real estate wallet" />
    <meta
      property="og:description"
      content="Manage your properties, collect rent, and grow your real estate portfolio with Olio Wallet — the all-in-one platform for landlords."
    />
    <meta property="og:image" content="https://oliowallet.com/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Olio Wallet — Your real estate wallet" />
    <meta
      name="twitter:description"
      content="Manage your properties, collect rent, and grow your real estate portfolio."
    />
    <meta name="twitter:image" content="https://oliowallet.com/opengraph.jpg" />

    <!-- Structured data — tells Google your brand identity for the knowledge panel -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Olio Wallet",
        "url": "https://oliowallet.com",
        "logo": "https://oliowallet.com/logo-symbol.png",
        "description": "All-in-one real estate wallet for landlords — property management, rent collection, and portfolio analytics.",
        "applicationCategory": "FinanceApplication"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
