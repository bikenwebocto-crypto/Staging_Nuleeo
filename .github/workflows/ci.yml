name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the checked-out code. Declaring this caps the
# GITHUB_TOKEN at read-only instead of the repo/org default (often read-write),
# shrinking the blast radius of a compromised action in the tool-chain.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (not floating-tag) so a Codeload outage on whatever
      # SHA `@v6` happens to resolve to cannot wedge CI. When bumping,
      # update the version comment above the pin.

      # actions/checkout@v6 — Node 24 native
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-node@v6 — Node 24 native
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          # Matches functions/package.json engines.node so CI runs on
          # the same major version as the deployed Cloud Function.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Dependency-audit gate: `npm audit --audit-level=high` reddens CI only
      # on a NEW high/critical CVE, not on the existing moderate backlog (8
      # moderate advisories today → exit 0, so this passes now). A high or
      # critical advisory makes npm audit exit non-zero and fails the build,
      # surfacing it before it ships. Mirrors the "warn on legacy, fail on new"
      # posture of the Lint step. Root-only for now: a functions/ audit would
      # need functions deps installed first (that happens later, before Test),
      # and the root tree is where app + tooling deps live.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run check

      # Lint gate: `eslint .` is configured (eslint.config.js) so the
      # existing backlog surfaces as WARNINGS (non-fatal) while clean rules
      # stay as errors — so this step reddens only on NEW violations, not on
      # the legacy code. Runs before Test; needs no functions deps.
      - name: Lint
        run: npm run lint

      # Format gate: `prettier --check .` (honoring .prettierignore) fails
      # the build if any committed file drifts from the repo's Prettier
      # style. Run `npm run format` locally to fix.
      - name: Format check
        run: npm run format:check

      # Docs-lint check: recomputes the real test-file count and WARNS (does
      # not fail) when the number cited in README.md has drifted past
      # tolerance. Catches the stale-docs class of regression (the README's
      # "~N tests across ~M files" line silently rotting as the suite grows)
      # WITHOUT blocking a ship over a cosmetic doc string — same "warn on
      # legacy, fail on new" posture as the Lint and Audit steps above. The
      # drift surfaces as a run annotation; run `npx tsx script/checkDocs.ts
      # --strict` locally to enforce it. Filesystem-only — no secrets, no
      # functions deps — so it slots in beside the other static checks. tsx is
      # a root dev dep installed by `npm ci` above.
      - name: Docs lint
        run: npx tsx script/checkDocs.ts

      # Design-token guard: fails the build if a file in the token-pure set
      # (shared ui/ primitives + the migrated shared roots / feature dirs) ever
      # reintroduces a raw chromatic Tailwind palette utility (text-red-600,
      # bg-emerald-500/10, …) instead of the semantic tokens. Those raw
      # utilities carry no .dark pairing and are the recurring dark-mode bug.
      # Scoped to the cleaned set, so it's green today and only reddens on NEW
      # regressions there. Add a "tokens-ok" line comment for intentional
      # exceptions; extend the CHECKED set in the script as more files migrate.
      - name: Design token guard
        run: npx tsx script/checkDesignTokens.ts

      # Functions deps must exist before Test: the root vitest suite
      # (include "**/*.test.ts") also collects functions/src/*.test.ts, which
      # import firebase-functions from functions/node_modules. Installing here
      # (rather than only before Build Functions) keeps those tests runnable.
      - name: Install Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Test
        # Runs the vitest suite (server services + client sanitizers) WITH
        # coverage — the coverage thresholds in vitest.config.ts gate the build,
        # so a removed test suite or a large untested module fails CI here.
        # Without this step, security-critical helpers like safeRedirect,
        # rateLimit, rentTransaction.advanceOneMonth, and sanitizeHtml
        # could regress on push without anyone noticing — typecheck
        # catches shape changes but not behavior.
        # queryClient.ts imports firebase/auth at module load + Firebase
        # SDK rejects empty apiKey with auth/invalid-api-key. We use
        # dummy values here — none of the tests authenticate; they just
        # need Firebase init to not throw. The Deploy workflow uses real
        # production secrets via `environment: production`.
        run: npm run test:coverage
        env:
          VITE_FIREBASE_API_KEY: ci-test-stub-key
          VITE_FIREBASE_AUTH_DOMAIN: ci-test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-test
          VITE_FIREBASE_STORAGE_BUCKET: ci-test.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "0"
          VITE_FIREBASE_APP_ID: ci-test-app-id
          VITE_FIREBASE_MEASUREMENT_ID: G-CITEST

      - name: Build all subdomains + server
        run: npm run build

      # Functions deps already installed before the Test step above.
      - name: Build Functions
        run: npm run build
        working-directory: functions

      # Posts the CI result to Discord. `if: always()` so a red run pings
      # too (you chose failures + successes). No-ops when the webhook
      # secret is unset (e.g. contributor forks) so it never errors.
      # Untrusted values (commit message) go through env, not inline
      # `${{ }}`, to avoid shell injection; jq builds the JSON safely.
      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          [ "$JOB_STATUS" = "cancelled" ] && exit 0
          if [ "$JOB_STATUS" = "success" ]; then
            STATUS="build success"; COLOR=3066993
          else
            STATUS="build failed"; COLOR=15158332
          fi
          jq -n --arg t "[olio-fe] $STATUS on $REF_NAME" \
                --arg u "$RUN_URL" \
                --arg d "$COMMIT_MSG" \
                --argjson c "$COLOR" \
                '{embeds:[{title:$t,url:$u,description:($d[0:200]),color:$c}]}' \
          | curl -s -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK" \
          || echo "::warning::Discord notification failed"

  # Firestore SECURITY-RULES tests, isolated from the build job because they
  # need the Firestore emulator (Java + firebase-tools), which the rest of CI
  # doesn't. They run via `firebase emulators:exec` against a demo- project, so
  # no GCP credentials are involved. This job is part of the CI workflow, so a
  # red run here makes the whole CI run fail — which gates Deploy (workflow_run
  # on CI success), so a rules regression cannot ship.
  firestore-rules:
    runs-on: ubuntu-latest
    # ubuntu-latest ships a JDK on PATH (the emulator needs Java); no setup-java
    # step required. Bound the job so a stuck emulator/install can't run for 6h.
    timeout-minutes: 15
    steps:
      # actions/checkout@v6 — Node 24 native
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-node@v6 — Node 24 native
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # firebase-tools provides the Firestore emulator. Same timeout+retry as
      # the Deploy workflow: this global install has hung mid-fetch before, and
      # `timeout` caps each attempt so it can't burn the job budget.
      - name: Install Firebase CLI
        run: |
          for attempt in 1 2 3; do
            if timeout 300 npm install -g firebase-tools@^14; then
              exit 0
            fi
            echo "::warning::firebase-tools install attempt $attempt timed out or failed — retrying"
          done
          echo "::error::firebase-tools install failed after 3 attempts"
          exit 1

      # Boots the firestore emulator, runs the rules suite against it, tears it
      # down. --project demo-olio-rules needs no GCP credentials; the emulator
      # JAR is fetched from Google's CDN on a cold runner.
      - name: Firestore rules tests
        run: npm run test:rules
